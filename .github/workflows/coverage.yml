# Coverage upload workflow
# Runs after the Test workflow completes so it has access to repository secrets
# (workflow_run has full secret access regardless of PR origin, unlike pull_request)
name: Coverage

on:
  workflow_run:
    workflows: ["Test"]
    types: [completed]

permissions:
  contents: read
  pull-requests: write

jobs:
  upload-coverage:
    name: Upload to Codecov
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Download coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage
          path: ./coverage
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ./coverage
          fail_ci_if_error: false
