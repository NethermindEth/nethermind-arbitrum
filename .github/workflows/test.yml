# Test and coverage workflow
# Uses XPlat Code Coverage (built-in) + Codecov for reporting
name: Test

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  id-token: write

env:
  JFROG_URL: nethermind.jfrog.io
  NUGET_REPO: core-nuget-local-prod

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup JFrog CLI
        id: jfrog
        uses: jfrog/setup-jfrog-cli@v4
        env:
          JF_URL: https://${{ env.JFROG_URL }}
        with:
          oidc-provider-name: github-nethermindeth

      - name: Add Artifactory NuGet source
        run: |
          dotnet nuget add source \
            "https://${{ env.JFROG_URL }}/artifactory/api/nuget/v3/${{ env.NUGET_REPO }}/index.json" \
            --name artifactory \
            --username "${{ steps.jfrog.outputs.oidc-user }}" \
            --password "${{ steps.jfrog.outputs.oidc-token }}" \
            --store-password-in-clear-text

      - name: Test with coverage
        run: >
          dotnet test src/Nethermind.Arbitrum.Test/Nethermind.Arbitrum.Test.csproj
          --configuration Release
          --collect:"XPlat Code Coverage"
          --results-directory ./coverage
          --
          DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura
          DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Include=[Nethermind.Arbitrum*]*

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ./coverage
          fail_ci_if_error: false

  # Notify on failure for automated submodule update PRs
  notify-submodule-failure:
    name: Notify Submodule Update Failure
    needs: test
    if: needs.test.result == 'failure' && startsWith(github.head_ref, 'auto/nethermind-update')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Post failure comment on PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          if [ -z "$PR_NUMBER" ]; then
            echo "No PR number found, skipping notification"
            exit 0
          fi

          gh pr comment "$PR_NUMBER" \
            --repo "$REPO" \
            --body "## ⚠️ Test Failure Detected

          The Nethermind submodule update introduced a test failure.

          **Failed Job:** test
          **Workflow Run:** $SERVER_URL/$REPO/actions/runs/$RUN_ID

          Please review the failure and either:
          1. Fix compatibility in a follow-up commit
          2. Close this PR and wait for upstream fix
          3. Pin to a specific working commit"

          gh pr edit "$PR_NUMBER" \
            --repo "$REPO" \
            --add-label "breaking-change"
