# Test and coverage workflow
# Uses XPlat Code Coverage (built-in) + Codecov for reporting
name: Test

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      src: ${{ steps.filter.outputs.src }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            src:
              - 'src/**'

  test:
    name: Test
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.src == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Test with coverage
        run: >
          dotnet test src/Nethermind.Arbitrum.Test/Nethermind.Arbitrum.Test.csproj
          --configuration Release
          --collect:"XPlat Code Coverage"
          --results-directory ./coverage
          --
          DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura
          DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Include=[Nethermind.Arbitrum*]*

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: ./coverage
          retention-days: 1

  codecov_status:
    name: Codecov Status
    needs: [changes, test]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Fail if tests failed
        if: needs.test.result == 'failure'
        run: exit 1

      - name: Pass codecov checks — no source changes
        if: needs.test.result == 'skipped'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REPO: ${{ github.repository }}
        run: |
          for context in "codecov/patch" "codecov/project"; do
            gh api "repos/$REPO/statuses/$SHA" \
              -f state=success \
              -f context="$context" \
              -f description="No source changes"
          done

      - name: Download coverage artifact
        if: needs.test.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: coverage
          path: ./coverage

      - name: Upload to Codecov
        if: needs.test.result == 'success'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ./coverage
          fail_ci_if_error: false

  # Notify on failure for automated submodule update PRs
  notify-submodule-failure:
    name: Notify Submodule Update Failure
    needs: test
    if: needs.test.result == 'failure' && startsWith(github.head_ref, 'auto/nethermind-update')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Post failure comment on PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          if [ -z "$PR_NUMBER" ]; then
            echo "No PR number found, skipping notification"
            exit 0
          fi

          gh pr comment "$PR_NUMBER" \
            --repo "$REPO" \
            --body "## ⚠️ Test Failure Detected

          The Nethermind submodule update introduced a test failure.

          **Failed Job:** test
          **Workflow Run:** $SERVER_URL/$REPO/actions/runs/$RUN_ID

          Please review the failure and either:
          1. Fix compatibility in a follow-up commit
          2. Close this PR and wait for upstream fix
          3. Pin to a specific working commit"

          gh pr edit "$PR_NUMBER" \
            --repo "$REPO" \
            --add-label "breaking-change"
