name: Build Nethermind

on:
  workflow_call:
    inputs:
      artifact_name:
        description: 'Name for the build artifact'
        required: false
        default: 'nethermind-build'
        type: string

jobs:
  build:
    name: Build Nethermind + Arbitrum Plugin
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout Nethermind-Arbitrum
        uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build Nethermind
        run: dotnet build src/Nethermind/src/Nethermind/Nethermind.slnx -c Debug

      - name: Build Arbitrum plugin
        run: dotnet build src/Nethermind.Arbitrum/Nethermind.Arbitrum.csproj -c Debug

      - name: Generate system test config
        run: ./src/Nethermind.Arbitrum/Properties/scripts/generate-system-test-config.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: |
            src/Nethermind/src/Nethermind/artifacts/bin/Nethermind.Runner/debug/
          retention-days: 1
