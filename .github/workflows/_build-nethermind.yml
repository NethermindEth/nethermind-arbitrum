name: Build Nethermind

on:
  workflow_call:
    inputs:
      project:
        description: 'Project to build (csproj path)'
        required: false
        default: 'src/Nethermind.Arbitrum/Nethermind.Arbitrum.csproj'
        type: string
      configuration:
        description: 'Build configuration (Debug/Release)'
        required: false
        default: 'Debug'
        type: string
      artifact_name:
        description: 'Name for the build artifact (empty = no upload)'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  id-token: write

env:
  JFROG_URL: nethermind.jfrog.io
  NUGET_REPO: core-nuget-local-prod

jobs:
  build:
    name: Build Nethermind (${{ inputs.configuration }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Setup JFrog CLI
        id: jfrog
        uses: jfrog/setup-jfrog-cli@v4
        env:
          JF_URL: https://${{ env.JFROG_URL }}
        with:
          oidc-provider-name: github-nethermindeth

      - name: Add Artifactory NuGet source
        run: |
          dotnet nuget add source \
            "https://${{ env.JFROG_URL }}/artifactory/api/nuget/v3/${{ env.NUGET_REPO }}/index.json" \
            --name artifactory \
            --username "${{ steps.jfrog.outputs.oidc-user }}" \
            --password "${{ steps.jfrog.outputs.oidc-token }}" \
            --store-password-in-clear-text

      - name: Build
        run: dotnet build ${{ inputs.project }} -c ${{ inputs.configuration }}

      - name: Upload build artifact
        if: inputs.artifact_name != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: src/Nethermind/src/Nethermind/artifacts/bin/Nethermind.Runner/${{ inputs.configuration == 'Debug' && 'debug' || 'release' }}/
          retention-days: 1
