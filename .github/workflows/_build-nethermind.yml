name: Build Nethermind

on:
  workflow_call:
    inputs:
      configuration:
        description: 'Build configuration (Debug or Release)'
        required: false
        default: 'Debug'
        type: string
      artifact_name:
        description: 'Name for the build artifact'
        required: false
        default: 'nethermind-build'
        type: string

env:
  JFROG_URL: nethermind.jfrog.io
  NUGET_REPO: core-nuget-local-prod

jobs:
  build:
    name: Build Nethermind + Arbitrum Plugin
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Nethermind-Arbitrum
        uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup JFrog CLI
        id: jfrog
        uses: jfrog/setup-jfrog-cli@v4
        env:
          JF_URL: https://${{ env.JFROG_URL }}
        with:
          oidc-provider-name: github-nethermindeth

      - name: Add Artifactory NuGet source
        run: |
          dotnet nuget add source \
            "https://${{ env.JFROG_URL }}/artifactory/api/nuget/v3/${{ env.NUGET_REPO }}/index.json" \
            --name artifactory \
            --username "${{ steps.jfrog.outputs.oidc-user }}" \
            --password "${{ steps.jfrog.outputs.oidc-token }}" \
            --store-password-in-clear-text

      - name: Build Nethermind
        run: dotnet build src/Nethermind/src/Nethermind/Nethermind.slnx -c ${{ inputs.configuration }}

      - name: Build Arbitrum plugin
        run: dotnet build src/Nethermind.Arbitrum/Nethermind.Arbitrum.csproj -c ${{ inputs.configuration }}

      - name: Generate system test config
        run: ./src/Nethermind.Arbitrum/Properties/scripts/generate-system-test-config.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        env:
          CONFIG_LOWER: ${{ inputs.configuration == 'Release' && 'release' || 'debug' }}
        with:
          name: ${{ inputs.artifact_name }}
          path: |
            src/Nethermind/src/Nethermind/artifacts/bin/Nethermind.Runner/${{ env.CONFIG_LOWER }}/
          retention-days: 1
