# Python code quality workflow
# Runs only when Python files change
name: Python

on:
  push:
    branches: [main, develop]
    paths:
      - 'tools/comparison/**/*.py'
      - 'tools/comparison/pyproject.toml'
      - '.github/workflows/python.yml'
  pull_request:
    paths:
      - 'tools/comparison/**/*.py'
      - 'tools/comparison/pyproject.toml'
      - '.github/workflows/python.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install tools
        run: pip install ruff mypy pydantic

      - name: Check formatting
        run: ruff format --check tools/comparison

      - name: Check linting
        run: ruff check tools/comparison

      - name: Type check
        run: mypy tools/comparison/comparison_runner --ignore-missing-imports

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: tools/comparison/pyproject.toml

      - name: Install dependencies
        working-directory: tools/comparison
        run: pip install -e ".[dev]"

      - name: Run tests with coverage
        working-directory: tools/comparison
        run: pytest --tb=short -v --cov=comparison_runner --cov-report=term-missing --cov-fail-under=65
