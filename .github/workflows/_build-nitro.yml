name: Build Nitro Dependencies

on:
  workflow_call:
    inputs:
      nitro_repo:
        description: 'Nitro repository (org/repo)'
        required: false
        default: 'OffchainLabs/nitro'
        type: string
      nitro_branch:
        description: 'Nitro branch to build'
        required: true
        type: string
      artifact_name:
        description: 'Name for the build artifact'
        required: false
        default: 'nitro-build'
        type: string

permissions: {}

jobs:
  build:
    name: Build Nitro (${{ inputs.nitro_branch }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout Nitro
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.nitro_repo }}
          ref: ${{ inputs.nitro_branch }}
          submodules: recursive
          fetch-depth: 1

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: yarn
          cache-dependency-path: '**/yarn.lock'

      - name: Install Rust
        id: install-rust
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: wasm32-wasip1, wasm32-unknown-unknown
          components: rustfmt

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "nitro-build"
          cache-on-failure: true
          cache-directories: |
            crates/wasm-libraries/target/
            target/etc/initial-machine-cache/

      - name: Cache cbrotli
        id: cache-cbrotli
        uses: actions/cache@v5
        with:
          path: |
            target/include/brotli/
            target/lib/libbrotli*.a
          key: ${{ runner.os }}-cbrotli-${{ hashFiles('scripts/build-brotli.sh', 'brotli/**') }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wabt lld-14
          sudo ln -sf /usr/bin/wasm-ld-14 /usr/local/bin/wasm-ld

      - name: Setup Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.0.0

      - name: Build cbrotli-lib
        if: steps.cache-cbrotli.outputs.cache-hit != 'true'
        run: ./scripts/build-brotli.sh -l

      - name: Install cbindgen
        run: cargo install --force cbindgen

      - name: Build node dependencies
        run: make -j"$(nproc)" build-node-deps

      - name: Build Nitro binary
        run: |
          mkdir -p target/bin
          go build -o target/bin/nitro ./cmd/nitro

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_name }}
          path: |
            target/bin/
            target/lib/
            target/include/
            target/machines/
            solgen/
            go-ethereum/
          retention-days: 1
