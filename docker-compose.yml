
services:
  # Kept for reference / full-docker runs. Not started by default.
  # Override NETHERMIND_IMAGE to use a custom build.
  nethermind-arbitrum:
    profiles: [docker]
    image: ${NETHERMIND_IMAGE:-nethermind/nethermind-arbitrum:0.1.0-alpha}
    container_name: nethermind-arbitrum
    restart: 'no'
    ports:
      - 20545:20545
      - 20551:20551
      - 30303:30303/tcp
      - 30303:30303/udp
      - 8008:8008
    volumes:
      - ./nethermind-data:/app/nethermind_db
    command:
      - -c=${NETWORK:-arbitrum-sepolia-with-validation}
      - --data-dir=/app/nethermind_db
      - --JsonRpc.Host=0.0.0.0
      - --JsonRpc.EngineHost=0.0.0.0
      - --JsonRpc.JwtSecretFile=/app/nethermind_db/jwt.hex
    networks:
      - nethermind-network
    healthcheck:
      test:
        - CMD-SHELL
        - timeout 5 bash -c '</dev/tcp/localhost/20551' || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  nitro:
    image: ${NITRO_IMAGE:-offchainlabs/nitro-node:v3.10.0-rc.2-746bda2}
    container_name: nitro
    entrypoint: /usr/local/bin/nitro
    user: root
    restart: 'no'
    # Allows the container to reach services on the host (e.g. local Nethermind on port 20551).
    # On macOS host.docker.internal resolves automatically; extra_hosts covers Linux.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - 8747:8747
    volumes:
      - ${NITRO_DATA_DIR}:/tmp/nitro-data
      # JWT_FILE must point to the same file used by the local Nethermind instance.
      # Default matches the Makefile: JWT_FILE ?= $(HOME)/.arbitrum/jwt.hex
      - ${JWT_FILE}:/tmp/jwt.hex:ro
    command:
      - --init.empty=true
      - --init.validate-genesis-assertion=false
      - --persistent.global-config=/tmp/nitro-data
      - --parent-chain.connection.url=${PARENT_CHAIN_RPC_URL}
      - --parent-chain.blob-client.beacon-url=${PARENT_CHAIN_BEACON_URL}
      - --chain.id=${CHAIN_ID:-421614}
      - --execution.forwarding-target=null
      - --log-level=${LOG_LEVEL:-INFO}
      - --http.addr=0.0.0.0
      - --http.port=8747
      # Engine API endpoint for the local Nethermind EL
      - --node.execution-rpc-client.url=http://host.docker.internal:20551
      - --node.execution-rpc-client.jwtsecret=/tmp/jwt.hex
      - --node.sequencer=false
      - --node.staker.enable=false
      # Block validation (self-auth = runs within this nitro process)
      - --node.block-validator.enable=true
      - --node.block-validator.validation-server.url=self-auth
      - --node.block-validator.current-module-root=latest
      - --validation.wasm.enable-wasmroots-check=false
      - --validation.use-jit=true
    networks:
      - nethermind-network

networks:
  nethermind-network:
    name: nethermind-network
