[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "comparison-runner"
version = "0.1.0"
description = "Nethermind-Arbitrum comparison test runner with parallel execution support"
readme = "README.md"
license = {text = "LGPL-3.0"}
requires-python = ">=3.12"
authors = [
    {name = "Nethermind", email = "hello@nethermind.io"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Lesser General Public License v3 (LGPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "pydantic>=2.0",
    "psutil>=5.9",
    "eth-keys>=0.4",
    "eth-hash[pycryptodome]>=0.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "hypothesis>=6.0",
    "mypy>=1.8",
    "ruff>=0.2",
]

[project.scripts]
comparison-runner = "comparison_runner.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["comparison_runner*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
python_files = ["test_*.py"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
